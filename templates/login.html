{% extends 'base.html' %}

{% block title %} 로그인 {% endblock %}

{% block content %}

    <!-- 가운데 좁은 상자: 로고 · 칸 · 버튼 · 오류 -->
    <div class="form-box form-box-auth">
        <h1 class="form-logo"><span class="logo-mark" aria-hidden="true">ı</span><span aria-hidden="true">nsta</span><span class="visually-hidden">LOGIN</span></h1>

        <form class="d-flex flex-column gap-2" action="/login" method="post">
            <label class="visually-hidden" for="username">아이디</label>
            <input class="insta-input" type="text" id="username" name="username" placeholder="아이디" autocomplete="username" required>
            <label class="visually-hidden" for="password">비밀번호</label>
            <input class="insta-input" type="password" id="password" name="password" placeholder="비밀번호" autocomplete="current-password" required>
            <input class="insta-button insta-button-blue form-submit" type="submit" value="로그인">
        </form>

        {% if error %}
            <p class="form-error" role="alert"><i class="bi bi-exclamation-circle" aria-hidden="true"></i> {{ error }}</p>
        {% endif %}
    </div>

    <!-- 아래 작은 상자: 가입으로 -->
    <p class="form-box form-box-small">계정이 없으신가요? <a class="form-link text-decoration-none" href="/signup">가입하기</a></p>

{% endblock %}
